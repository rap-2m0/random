<!DOCTYPE html>
<html>
  <head>
    <title>Sheet Data on GitHub</title>
    <style>
      body { font-family: Arial, sans-serif; padding: 20px; }
      .card { background: #f4f4f4; padding: 15px; border-radius: 8px; width: 250px; }
    </style>
  </head>
  <body>

    <div id="loading">Loading data from Google Sheet...</div>

    <div class="card" id="profileCard" style="display: none;">
      <p><strong>Name:</strong> <span id="userName"></span></p>
      <p><strong>Rank:</strong> <span id="userRank"></span></p>
      <p><strong>Balance:</strong> $<span id="userBal"></span></p>
    </div>

    <script>
      // REPLACE THIS WITH YOUR DEPLOYED WEB APP URL
     const API_URL = "https://script.google.com/macros/s/AKfycbxlbfjPRHDDcn71cixgmgR6-dGT52HwJQoHxAxKYuRoxqiegzDNCqeE2wvn6ny8YM31/exec";

window.onload = function() {
  fetch(API_URL, {
    method: "GET",
    redirect: "follow" // Forces the browser to follow Google's redirect
  })
    .then(response => {
      if (!response.ok) {
        throw new Error("Network response was not ok: " + response.statusText);
      }
      return response.json();
    })
    .then(data => {
      document.getElementById('userName').textContent = data.name;
      document.getElementById('userRank').textContent = data.rank;
      document.getElementById('userBal').textContent = data.bal;

      document.getElementById('loading').style.display = 'none';
      document.getElementById('profileCard').style.display = 'block';
    })
    .catch(error => {
      document.getElementById('loading').textContent = "Failed to load data. Check browser console (F12) for details.";
      console.error("Error fetching data:", error);
    });
};
    </script>
  </body>
</html>
