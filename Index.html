<!DOCTYPE html>
<html>
<head>
  <title>Send Name to Google Sheet</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; }
    input, button { padding: 10px; font-size: 16px; margin-top: 10px; }
  </style>
</head>
<body>

  <h2>Submit Your Name</h2>
  <input type="text" id="nameInput" placeholder="Enter your name">
  <button onclick="sendData()">Send to Sheet</button>

  <p id="status"></p>

  <script>
    // PASTE YOUR GOOGLE WEB APP URL HERE
    const API_URL = "https://script.google.com/macros/s/AKfycbyXrZkjTkMunH-I66Ga6oNQhn8-xqgATq2DaoUHWAVboPlFB4K30YYArNzB4IDO4HWK/exec";

    function sendData() {
  const nameInput = document.getElementById("nameInput");
  const nameValue = nameInput.value.trim();
  const statusText = document.getElementById("status");

  if (!nameValue) {
    statusText.textContent = "Please type a name first!";
    statusText.style.color = "red";
    return;
  }

  statusText.textContent = "Sending...";
  statusText.style.color = "black";

  const formData = new FormData();
  formData.append("name", nameValue);

  fetch(API_URL, {
    method: "POST",
    body: formData,
    mode: "no-cors" // Prevents the browser CORS block!
  })
  .then(() => {
    // With no-cors, reaching this step guarantees Google received the data
    statusText.textContent = "Submitted successfully!";
    statusText.style.color = "green";
    nameInput.value = "";
  })
  .catch(err => {
    statusText.textContent = "Network error. Please try again.";
    statusText.style.color = "red";
    console.error(err);
  });
}
  </script>

</body>
</html>
