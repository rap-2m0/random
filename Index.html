<!DOCTYPE html>
<html>
<head>
  <title>Send Name to Google Sheet</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; }
    input, button { padding: 10px; font-size: 16px; margin-top: 10px; }
  </style>
</head>
<body>

  <h2>Submit Your Name</h2>
  <input type="text" id="nameInput" placeholder="Enter your name">
  <button onclick="sendData()">Send to Sheet</button>

  <p id="status"></p>

  <script>
    // PASTE YOUR GOOGLE WEB APP URL HERE
    const API_URL = "https://script.google.com/macros/s/AKfycbwf7P52T3Mw1hHY0HvUkB0yEYe0yanQ1qssk2DMJUXtI6m_fk59r32xJpM8uaZb48s/exec";

    function sendData() {
      const nameValue = document.getElementById("nameInput").value;
      const statusText = document.getElementById("status");

      if (!nameValue) {
        statusText.textContent = "Please enter a name!";
        return;
      }

      statusText.textContent = "Sending...";

      fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ name: nameValue })
      })
      .then(res => res.json())
      .then(data => {
        statusText.textContent = "Success! Name sent to Google Sheet.";
        document.getElementById("nameInput").value = "";
      })
      .catch(err => {
        statusText.textContent = "Error sending data.";
        console.error(err);
      });
    }
  </script>

</body>
</html>
