<!DOCTYPE html>
<html>
<head>
  <title>User Registration</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Narrow, poem-like centered container */
    .card {
      background: #ffffff;
      padding: 35px 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      text-align: center;
      width: 100%;
      max-width: 260px; /* Kept narrow so it doesn't stretch side to side */
      margin: 0 auto;
    }

    h2 {
      margin-top: 0;
      color: #333;
      margin-bottom: 20px;
      font-size: 20px;
    }

    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      font-size: 15px;
      border-radius: 6px;
      box-sizing: border-box;
      text-align: center; /* Centers the input text */
    }

    input {
      border: 1px solid #ccc;
      outline: none;
      transition: border 0.3s;
    }

    input:focus {
      border-color: #28a745;
    }

    button {
      background-color: #28a745;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 18px;
    }

    button:hover {
      background-color: #218838;
    }

    #status, #pinStatus {
      margin-top: 15px;
      font-size: 14px;
      font-weight: 500;
    }

    /* Utility class to hide elements */
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- 1. PIN CODE SCREEN (Shows First) -->
  <div class="card" id="pinCard">
    <h2>Enter Access PIN</h2>
    <input type="password" id="pinInput" placeholder="Enter PIN">
    <button onclick="checkPin()">Unlock</button>
    <p id="pinStatus"></p>
  </div>

  <!-- 2. REGISTRATION FORM (Hidden Until PIN is Correct) -->
  <div class="card hidden" id="regCard">
    <h2>User Registration</h2>
    
    <input type="text" id="nameInput" placeholder="Enter Name">
    <input type="text" id="rankInput" placeholder="Enter Rank">
    <input type="number" id="balInput" placeholder="Enter Balance">
    
    <button onclick="sendData()">Send to Sheet</button>

    <p id="status"></p>
  </div>

  <script>
    // PASTE YOUR GOOGLE WEB APP URL HERE
    const API_URL = "https://script.google.com/macros/s/AKfycbwkXAasX7tgoTxVO09FQpBF3WzvBid05r1NA1-pyC-eQZMbeJYzKILEyULM3d73zNKh/exec";
    
    // SECRET PIN
    const CORRECT_PIN = "04292008";

    // FUNCTION TO CHECK PIN
    function checkPin() {
      const pinInput = document.getElementById("pinInput");
      const pinStatus = document.getElementById("pinStatus");

      if (pinInput.value.trim() === CORRECT_PIN) {
        // Hide PIN screen & show registration form
        document.getElementById("pinCard").classList.add("hidden");
        document.getElementById("regCard").classList.remove("hidden");
      } else {
        pinStatus.textContent = "Incorrect PIN!";
        pinStatus.style.color = "red";
        pinInput.value = "";
      }
    }

    // FUNCTION TO SEND DATA TO GOOGLE SHEET
    function sendData() {
      const nameInput = document.getElementById("nameInput");
      const rankInput = document.getElementById("rankInput");
      const balInput  = document.getElementById("balInput");
      
      const nameValue = nameInput.value.trim();
      const rankValue = rankInput.value.trim();
      const balValue  = balInput.value.trim();
      
      const statusText = document.getElementById("status");

      if (!nameValue || !rankValue || !balValue) {
        statusText.textContent = "Please fill in all fields!";
        statusText.style.color = "red";
        return;
      }

      statusText.textContent = "Sending...";
      statusText.style.color = "#555";

      const formData = new FormData();
      formData.append("name", nameValue);
      formData.append("rank", rankValue);
      formData.append("bal", balValue);

      fetch(API_URL, {
        method: "POST",
        body: formData,
        mode: "no-cors"
      })
      .then(() => {
        statusText.textContent = "Submitted successfully!";
        statusText.style.color = "green";
        
        // Clear inputs
        nameInput.value = "";
        rankInput.value = "";
        balInput.value = "";
      })
      .catch(err => {
        statusText.textContent = "Error sending data.";
        statusText.style.color = "red";
        console.error(err);
      });
    }
  </script>

</body>
</html>
