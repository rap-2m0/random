<!DOCTYPE html>
<html>
<head>
  <title>SERAPHYX PORTAL</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background: #ffffff;
      padding: 35px 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      text-align: center;
      width: 100%;
      max-width: 260px;
      margin: 0 auto;
    }

    h2 {
      margin-top: 0;
      color: #333;
      margin-bottom: 20px;
      font-size: 20px;
    }

    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      font-size: 15px;
      border-radius: 6px;
      box-sizing: border-box;
      text-align: center;
    }

    input {
      border: 1px solid #ccc;
      outline: none;
      transition: border 0.3s;
    }

    input:focus {
      border-color: #28a745;
    }

    button {
      background-color: #28a745;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 18px;
    }

    button:hover {
      background-color: #218838;
    }

    #status {
      margin-top: 15px;
      font-size: 14px;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>SERAPHYX PORTAL</h2>
    
    <input type="password" id="pinInput" placeholder="Enter Access PIN">
    <input type="text" id="nameInput" placeholder="Enter Name">
    <input type="text" id="rankInput" placeholder="Enter Rank">
    <input type="number" id="balInput" placeholder="Enter Balance">
    
    <button onclick="sendData()">SEND TO PORTAL</button>

    <p id="status"></p>
  </div>

  <script>
    // PASTE YOUR GOOGLE WEB APP URL HERE
    const API_URL = "https://script.google.com/macros/s/AKfycbyfcOzWMtYrgSx-FLNhDbb0lwF5Cl15JGy8fNsHRctjKN1bHv-r02ONPHX6dQATA9E/exec";

    function sendData() {
      const pinInput  = document.getElementById("pinInput");
      const nameInput = document.getElementById("nameInput");
      const rankInput = document.getElementById("rankInput");
      const balInput  = document.getElementById("balInput");
      
      const pinValue  = pinInput.value.trim();
      const nameValue = nameInput.value.trim();
      const rankValue = rankInput.value.trim();
      const balValue  = balInput.value.trim();
      
      const statusText = document.getElementById("status");

      if (!pinValue || !nameValue || !rankValue || !balValue) {
        statusText.textContent = "Please fill in all fields!";
        statusText.style.color = "red";
        return;
      }

      statusText.textContent = "Verifying & Sending...";
      statusText.style.color = "#555";

      const formData = new FormData();
      formData.append("pin", pinValue);
      formData.append("name", nameValue);
      formData.append("rank", rankValue);
      formData.append("bal", balValue);

      // We fetch using standard mode so we can read Google's response back!
      fetch(API_URL, {
        method: "POST",
        body: formData
      })
      .then(res => res.text())
      .then(result => {
        if (result === "WRONG_PIN") {
          statusText.textContent = "Error: Invalid Access PIN!";
          statusText.style.color = "red";
        } 
        else if (result === "DUPLICATE") {
          statusText.textContent = "Error: Name already registered!";
          statusText.style.color = "red";
        } 
        else {
          statusText.textContent = "Success! Saved to Sheet.";
          statusText.style.color = "green";
          
          // Clear inputs
          pinInput.value = "";
          nameInput.value = "";
          rankInput.value = "";
          balInput.value = "";
        }
      })
      .catch(err => {
        statusText.textContent = "Submission error. Try again.";
        statusText.style.color = "red";
        console.error(err);
      });
    }
  </script>

</body>
</html>
